name: Meshery Consul Code Quality
on:
  push:
    branches: [ master ] # keep it simple and reduce the abuse of CI resources    
  pull_request:
    branches: [ master ]
jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@master
        with:
          go-version: 1.23.x
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/checkout@master
      - name: golangci-lint
        uses: golangci/golangci-lint-action@master
        with:
          version: latest
      - name: Run golangci-lint
        run: make lint
  tidy:
    name: Go mod tidy
    needs: [lint]
    runs-on: ubuntu-22.04
    steps:
      - name: set up Go
        uses: actions/setup-go@master
        with:
          go-version: 1.23.x
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/checkout@master
      - name: tidy
        run: make tidy
  
  build:
    name: Build check
    runs-on: ubuntu-latest
    needs: [tidy]
    steps:
    - name: Check out code
      uses: actions/checkout@master
      with:
        fetch-depth: 1
    - name: Setup Go
      uses: actions/setup-go@master
      with:
        go-version: 1.23.x
        cache: true
        cache-dependency-path: go.sum
    - run: make gobuild
